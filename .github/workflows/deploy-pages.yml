name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: pip install "jinja2>=3.1.0"

      - name: Build static landing
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          REELS_API_BASE: ${{ vars.REELS_API_BASE != '' && vars.REELS_API_BASE || 'https://reels-api-8fj1.onrender.com' }}
        run: python scripts/build_github_pages.py

      - name: Verify Pages artifact
        run: test -f pages_site/index.html && test -f pages_site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
