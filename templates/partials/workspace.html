<header class="top workspace-top">
  <div class="workspace-title">
    <h2>Bảng tạo Reels</h2>
    <p class="sub">9:16 · 1080×1920 · 60fps · MP4</p>
  </div>
  <div class="actions">
    <label class="btn secondary">
      Nền chữ
      <select id="text-bg" class="select-inline" title="Màu nền từng dòng chữ">
        <option value="black" selected>Nền đen</option>
        <option value="white">Nền trắng</option>
      </select>
    </label>
    <label class="btn secondary">
      Thời lượng (s)
      <input type="number" id="duration" value="5" min="0.5" max="600" step="0.5" />
    </label>
    <button type="button" class="btn" id="btn-add-row">Thêm dòng</button>
    <button type="button" class="btn primary" id="btn-generate">Tạo Reels</button>
  </div>
</header>

<main class="layout workspace-layout">
  <section class="panel">
    <div class="panel-head">
      <h3>Danh sách Reels</h3>
      <span class="hint">STT · Chữ · Ảnh (Enter 2× = đoạn mới)</span>
    </div>
    <p id="text-limit-note" class="hint"></p>
    <p id="total-char-hint" class="hint char-hint" aria-live="polite"></p>
    <p id="char-hint" class="hint char-hint" aria-live="polite"></p>
    <p id="paste-notice" class="paste-notice" hidden aria-live="assertive"></p>
    <div class="table-wrap">
      <table class="grid">
        <thead>
          <tr>
            <th style="width:72px">STT</th>
            <th>Nội dung</th>
            <th style="width:220px">Ảnh</th>
            <th style="width:48px"></th>
          </tr>
        </thead>
        <tbody id="rows-body"></tbody>
      </table>
    </div>
    <p id="gen-status" class="status" aria-live="polite"></p>
    <ul id="downloads" class="downloads"></ul>
  </section>

  <section class="panel">
    <div class="panel-head">
      <h3>Thư viện ảnh</h3>
      <button type="button" class="btn secondary compact" id="btn-lib-upload">
        Tải ảnh
      </button>
      <input
        type="file"
        id="lib-upload"
        class="file-input-offscreen"
        accept="image/jpeg,image/png,image/webp,image/gif,image/heic,image/heif,.heic,.heif"
        multiple
      />
    </div>
    <p class="hint">
      JPG, PNG, WEBP, GIF (tối đa 40MB). Ảnh không đúng 9:16 sẽ tự scale + crop khi lưu.
      Bấm thumbnail để gán dòng; × để xóa khỏi thư viện.
    </p>
    <div id="upload-notice" class="upload-notice" hidden aria-live="assertive"></div>
    <div id="library" class="library"></div>
  </section>
</main>
